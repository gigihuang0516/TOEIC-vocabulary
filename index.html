<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TOEIC 多益主題單字庫</title>
  <style>
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>TOEIC 多益主題單字庫</h1>
    <div id="auth-container">
      <button id="login-btn">使用google登入</button>
      <!-- 💖 我的收藏按鈕放在 header 裡面 -->
      <button id="nav-fav-btn">💖 我的收藏</button>
    </div>
    <button id="back-btn" style="display:none;"></button>
  </header>
  
  <main>    
    <section id="topic-view"> 
      <h2>選擇主學習題</h2>
      <div id="topic-list"></div>
    </section>

    <section id="word-list-view" style="display: none;">
      <button id="back-to-topic-btn">返回主題列表</button>
      <h2 id="current_topic_title">主題名稱</h2>
      <div id="word-list"></div>
    </section>

    <section id="favorites-view" style="display: none;">
      <button id="back-from-fav-btn">⬅️ 返回</button>
      <h2>💖 我的收藏單字</h2>
      <div id="favorites-list" class="word-list"></div>
    </section>

    <section id="word-detail-view" style="display: none;">
      <div class="detail-card">
        <button id="close-detail-btn">✕ 關閉詳細頁</button>
        
        <!-- 📦 單字標題與收藏按鈕容器 -->
        <div class="word-header">
          <h2 id="detail-word">Word</h2>
          <button id="detail-fav-btn" class="fav-btn">🤍</button>
        </div>

        <p><strong id="detail-pos">pos</strong> <span id="detail-phonetic">[phonetic]</span></p>
        <p id="detail-def">中文解釋</p>
        <hr>
        <h3>例句</h3>
        <p id="detail_ex_en">Example sentence.</p>
        <p id="detail_ex_zh">例句中文翻譯。</p>
        <hr>
        <h3>常見搭配詞</h3>
        <ul id="detail-collocations">
            <!-- JavaScript 將動態插入搭配詞列表 -->
        </ul>
      </div>
    </section>
  </main>

  <!-- 1. Firebase SDK 基礎套件 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- 2. 初始化 Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyATuWC6kSepIHBvUSrucgkkL0YYY8hMaic",
      authDomain: "toeic-words-88095.firebaseapp.com",
      projectId: "toeic-words-88095",
      storageBucket: "toeic-words-88095.firebasestorage.app",
      messagingSenderId: "371967383806",
      appId: "1:371967383806:web:02ceaa49fde88d2688edaf",
      measurementId: "G-966C528372"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database(); // 初始化資料庫
    const googleProvider = new firebase.auth.GoogleAuthProvider();
  </script>

  <!-- 3. 最後才引入自己的主程式碼 -->
  <script src="script.js"></script>
</body>
</html>
