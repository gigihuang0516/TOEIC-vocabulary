<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"> 
  <title>TOEIC 單字庫</title> 
  <link rel="stylesheet" href="style.css"> 
  <style>
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 🌟 新的首頁全螢幕容器 -->
  <div id="hero-screen">
    <div class="hero-content">
      <!-- 1. 主標題文字與花紋 -->
      <div class="title-container">
        <h1>TOEIC 多益主題單字庫</h1>
      </div>

      <!-- 2. 三個按鈕區塊 -->
      <div id="auth-container">
        <button id="login-btn">登入google帳號</button>
        <button id="start-btn">選擇主題</button>
        <button id="nav-fav-btn">我的收藏</button>
      </div>
    </div>
  </div>

  <!-- 📦 主要內容區塊包覆 (加上 <main>) -->
  <main>
    <!-- 1. 主題列表區塊 (修正缺少的 topic-list 容器) -->
    <section id="topic-view" style="display: none;">
      <div class="topic-header">
       <button id="back-to-home-btn">← 返回首頁</button>
       <h2>選擇學習主題</h2>
     </div>
     <div id="topic-list"></div>
    </section>

    <!-- 單字列表頁面 -->
<section id="word-list-view" style="display: none;">
  <div class="word-list-header">
    <!-- 1. 主題名稱 -->
    <h2 id="current_topic_title">主題名稱</h2>
    <!-- 2. 返回主題列表按鈕 -->
    <button id="back-to-topic-btn">← 返回主題列表</button>
  </div>

  <!-- 3. 單字卡片列表容器 -->
  <div id="word-list"></div>
</section>

    <!-- 5. 單字詳細頁面 -->
<section id="word-detail-view" style="display: none;">
  <div class="detail-header">
    <!-- 最上面的關閉按鈕 -->
    <button id="close-detail-btn">X 關閉詳細頁面</button>
    <!-- 單字大標題 -->
    <h2 id="detail-word">單字</h2>
  </div>

  <!-- 下方大面積白色卡片 -->
  <div class="detail-card">
    <!-- 右上角愛心收藏按鈕 -->
    <div style="text-align: right;">
      <span id="detail-fav-btn" style="cursor: pointer; font-size: 1.8rem;">♡</span>
    </div>

    <!-- 音標與詞性 -->
    <div class="detail-meta">
      <span id="detail-pos" class="badge">pos</span>
      <span id="detail-phonetic">/phonetic/</span>
    </div>

    <!-- 中文釋義 -->
    <div class="detail-section">
      <h4>中文釋義</h4>
      <p id="detail-def">定義內容...</p>
    </div>

    <!-- 例句 -->
    <div class="detail-section">
      <h4>例句 Example</h4>
      <p id="detail_ex_en" class="ex-en">Example sentence...</p>
      <p id="detail_ex_zh" class="ex-zh">例句翻譯...</p>
    </div>

    <!-- 搭配詞 -->
    <div class="detail-section">
      <h4>常見搭配詞 Collocations</h4>
      <ul id="detail-collocations"></ul>
    </div>
  </div>
</section>

  <!-- 1. Firebase SDK 基礎套件 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- 2. 初始化 Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyATuWC6kSepIHBvUSrucgkkL0YYY8hMaic",
      authDomain: "toeic-words-88095.firebaseapp.com",
      projectId: "toeic-words-88095",
      storageBucket: "toeic-words-88095.firebasestorage.app",
      messagingSenderId: "371967383806",
      appId: "1:371967383806:web:02ceaa49fde88d2688edaf",
      measurementId: "G-966C528372"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
  </script>

    <!-- 6. 我的收藏單字頁面 -->
<section id="favorites-view" style="display: none;">
  <div class="fav-header">
    <div class="fav-header-left">
      <!-- 加上 class="capsule-btn" 確保膠囊圓角樣式生效 -->
      <button id="back-from-fav-btn" class="capsule-btn">← 返回</button>
      <h2>我的收藏單字</h2>
    </div>
    <!-- 右上角書本圖片 -->
    <img src="images/book.png" alt="Book" class="fav-book-img">
  </div>

  <!-- 收藏清單容器 -->
  <div id="favorites-list"></div>
</section>

  <!-- 3. 主程式碼 -->
  <script src="script.js"></script>
</body>
</html>
